[project]
name = "quietlog"
version = "0.1.0"
description = "Quietlog: one-tap migraine attack logging with voice notes and a printable summary."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.0",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-multipart>=0.0.18",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
